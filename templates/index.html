<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dost AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #12131a;
  --panel: #1a1c26;
  --panel-alt: #21232f;
  --border: #2a2d3b;
  --border-soft: #23252f;

  --text: #ececf1;
  --text-muted: #8d8fa3;
  --text-faint: #5e6178;

  --accent: #f2994a;
  --accent-strong: #ffb066;
  --accent-wash: rgba(242, 153, 74, 0.12);
  --accent-wash-strong: rgba(242, 153, 74, 0.2);

  --user-bubble: #2a2115;
  --user-bubble-border: #4a3620;

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Devanagari", -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
}

textarea {
  font-family: inherit;
}

::selection {
  background: var(--accent-wash-strong);
}

/* ---------- Layout ---------- */

.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
  transition: grid-template-columns 0.2s ease;
}

.app.sidebar-collapsed {
  grid-template-columns: 0px 1fr;
}

/* ---------- Sidebar ---------- */

.sidebar {
  background: #0e0f15;
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.sidebar-top {
  padding: 14px 12px 8px;
}

.new-chat-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.new-chat-btn:hover {
  background: var(--panel-alt);
  border-color: var(--accent);
  color: var(--accent-strong);
}

.thread-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 8px;
}

.thread-list-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  padding: 6px 8px 8px;
}

.thread-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
  transition: background 0.15s ease, color 0.15s ease;
}

.thread-item:hover {
  background: var(--panel-alt);
  color: var(--text);
}

.thread-item.active {
  background: var(--accent-wash);
  color: var(--accent-strong);
}

/* ---------- Main ---------- */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--text);
  flex: 1;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: background 0.15s ease, color 0.15s ease;
}

.icon-btn:hover {
  background: var(--panel-alt);
  color: var(--accent-strong);
}

/* ---------- Chat scroll area ---------- */

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.empty-state {
  position: relative;
  margin: auto;
  max-width: 560px;
  padding: 32px 24px;
  text-align: center;
}

.sparkles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.sparkle {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent-strong);
  box-shadow: 0 0 6px 1px rgba(242, 153, 74, 0.65);
  opacity: 0;
  animation-name: sparkle-twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes sparkle-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.4) translateY(0); }
  50% { opacity: 0.9; transform: scale(1) translateY(-6px); }
}

.greeting {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 8px;
}

.greeting-sub {
  color: var(--text-muted);
  font-size: 14.5px;
  margin: 0 0 22px;
}

.suggestion-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.suggestion-chip {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 13px;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.suggestion-chip:hover {
  border-color: var(--accent);
  color: var(--accent-strong);
}

.messages {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 12px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.msg {
  display: flex;
  max-width: 100%;
}

.msg.user {
  justify-content: flex-end;
}

.msg-body {
  min-width: 0;
  max-width: 85%;
}

.msg.assistant .msg-body {
  max-width: 100%;
}

.msg.user .msg-body {
  background: var(--user-bubble);
  border: 1px solid var(--user-bubble-border);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
}

.msg-text {
  white-space: pre-wrap;
  word-wrap: break-word;
  color: var(--text);
}

.msg-text p {
  margin: 0 0 10px;
}

.msg-text p:last-child {
  margin-bottom: 0;
}

.msg-text code {
  background: var(--panel-alt);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 13px;
}

.msg-text pre {
  background: #0d0e13;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  overflow-x: auto;
}

.msg-text pre code {
  background: none;
  padding: 0;
}

.dost-thinking {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
}

.dost-orb {
  position: relative;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  background: radial-gradient(circle at 32% 30%, var(--accent-strong), var(--accent) 55%, #7a3f12 100%);
  animation: orb-pulse 1.3s ease-in-out infinite;
}

.dost-orb::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: 0;
  animation: orb-ring 1.3s ease-out infinite;
}

@keyframes orb-pulse {
  0%, 100% { transform: scale(0.85); }
  50% { transform: scale(1.08); }
}

@keyframes orb-ring {
  0% { opacity: 0.5; transform: scale(0.7); }
  80% { opacity: 0; transform: scale(1.3); }
  100% { opacity: 0; transform: scale(1.3); }
}

.dost-thinking-label {
  color: var(--text-muted);
  font-size: 13px;
}

.msg-error {
  color: #e8846b;
  font-size: 13.5px;
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--user-bubble);
  border: 1px solid var(--user-bubble-border);
  border-radius: var(--radius-lg);
  padding: 8px 14px 8px 8px;
  max-width: 280px;
}

.file-chip-icon {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(155deg, var(--accent) 0%, #c9702b 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a0f04;
}

.file-chip-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.file-chip-name {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 190px;
}

.file-chip-status {
  font-size: 11.5px;
  color: var(--text-muted);
}

.file-chip.failed .file-chip-icon {
  background: linear-gradient(155deg, #e8846b 0%, #8a3220 100%);
}

.file-chip.failed .file-chip-status {
  color: #e8846b;
}

/* ---------- Composer ---------- */

.composer-wrap {
  flex-shrink: 0;
  padding: 10px 20px 16px;
}

.composer {
  max-width: 720px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 12px;
  transition: border-color 0.15s ease;
}

.composer:focus-within {
  border-color: var(--accent);
}

.composer-toolbar {
  display: flex;
  align-items: center;
  padding: 2px 0 6px;
}

.model-select {
  background: var(--panel-alt);
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12px;
  max-width: 160px;
}

.composer-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

.composer-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.5;
  max-height: 200px;
  padding: 6px 0;
}

.composer-input::placeholder {
  color: var(--text-faint);
}

.composer-icon-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;
}

.composer-icon-btn:hover {
  background: var(--panel-alt);
  color: var(--text);
}

.send-btn {
  background: var(--text-faint);
  color: #12131a;
}

.send-btn:not(:disabled) {
  background: var(--accent);
  color: #1a0f04;
}

.send-btn:not(:disabled):hover {
  background: var(--accent-strong);
}

.send-btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.composer-hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-faint);
  margin: 8px 0 0;
}

/* ---------- Scrollbars ---------- */

.chat-scroll::-webkit-scrollbar,
.thread-list::-webkit-scrollbar {
  width: 8px;
}

.chat-scroll::-webkit-scrollbar-thumb,
.thread-list::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 8px;
}

/* ---------- Responsive ---------- */

@media (max-width: 780px) {
  .app {
    grid-template-columns: 0px 1fr;
  }

  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 260px;
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }

  .app.sidebar-open .sidebar {
    transform: translateX(0);
  }

  .greeting {
    font-size: 26px;
  }
}

</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1V15M1 8H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New chat
      </button>
    </div>

    <div class="thread-list" id="threadList">
      <div class="thread-list-label">Recent</div>
      <!-- thread items injected by app.js -->
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="4" width="14" height="1.6" rx="0.8" fill="currentColor"/><rect x="2" y="8.2" width="14" height="1.6" rx="0.8" fill="currentColor"/><rect x="2" y="12.4" width="14" height="1.6" rx="0.8" fill="currentColor"/></svg>
      </button>
      <span class="topbar-title">Dost AI</span>
    </header>

    <section class="chat-scroll" id="chatScroll">

      <div class="empty-state" id="emptyState">
        <div class="sparkles" aria-hidden="true">
          <span class="sparkle" style="top:12%; left:18%; animation-delay:0s; animation-duration:3.2s;"></span>
          <span class="sparkle" style="top:22%; left:78%; animation-delay:0.6s; animation-duration:2.8s;"></span>
          <span class="sparkle" style="top:68%; left:12%; animation-delay:1.1s; animation-duration:3.6s;"></span>
          <span class="sparkle" style="top:78%; left:85%; animation-delay:0.3s; animation-duration:3s;"></span>
          <span class="sparkle" style="top:8%; left:52%; animation-delay:1.6s; animation-duration:3.4s;"></span>
          <span class="sparkle" style="top:45%; left:6%; animation-delay:2s; animation-duration:2.6s;"></span>
          <span class="sparkle" style="top:40%; left:94%; animation-delay:0.9s; animation-duration:3.1s;"></span>
          <span class="sparkle" style="top:88%; left:40%; animation-delay:1.4s; animation-duration:2.9s;"></span>
          <span class="sparkle" style="top:5%; left:88%; animation-delay:2.3s; animation-duration:3.3s;"></span>
          <span class="sparkle" style="top:60%; left:60%; animation-delay:0.4s; animation-duration:3.5s;"></span>
        </div>

        <h1 class="greeting">Kya haal hai, dost?</h1>
        <p class="greeting-sub">Ask me anything — writing, understanding a concept, or just to chat.</p>

        <div class="suggestion-row">
          <button class="suggestion-chip" data-prompt="What's today's top news?">Today's top news</button>
          <button class="suggestion-chip" data-prompt="Explain photosynthesis in simple terms">Explain a concept</button>
          <button class="suggestion-chip" data-prompt="Calculate a 15% tip on 850">Do a calculation</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

    </section>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="composer-toolbar">
          <select id="modelSelect" class="model-select">
            <option value="openai/gpt-oss-120b" selected>GPT-OSS 120B</option>
            <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
            <option value="qwen/qwen3.6-27b">Qwen 3.6 27B</option>
          </select>
        </div>

        <div class="composer-row">
          <button class="composer-icon-btn" id="attachBtn" aria-label="Attach file" title="Upload document">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3.5V14.5M3.5 9H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.py,.csv" style="display:none" />

          <textarea
            id="messageInput"
            class="composer-input"
            placeholder="Ask Dost AI anything..."
            rows="1"
          ></textarea>

          <button class="composer-icon-btn send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <p class="composer-hint">Dost AI can make mistakes — check important info.</p>
    </div>

  </main>
</div>

<script>
/*
  Dost AI — frontend logic
  --------------------------------------------------------------
  Wired to the actual app.py routes:

  GET  /conversations           -> { conversations: [{thread_id, title, created_at, updated_at}] }
  GET  /history/{thread_id}     -> { messages: [{role, content}] }
  POST /upload  (multipart)     -> file, thread_id  =>  { success, message }
  POST /chat/stream             -> body: { message, thread_id, model }
                                    response: text/event-stream,
                                    each event "data: {...}\n\n" with
                                    { token } | { done: true } | { error }
  --------------------------------------------------------------
*/

const CHAT_ENDPOINT = "/chat/stream";
const CONVERSATIONS_ENDPOINT = "/conversations";
const HISTORY_ENDPOINT = "/history";
const UPLOAD_ENDPOINT = "/upload";

const els = {
  app: document.querySelector(".app"),
  sidebar: document.getElementById("sidebar"),
  sidebarToggle: document.getElementById("sidebarToggle"),
  newChatBtn: document.getElementById("newChatBtn"),
  threadList: document.getElementById("threadList"),
  emptyState: document.getElementById("emptyState"),
  chatScroll: document.getElementById("chatScroll"),
  messages: document.getElementById("messages"),
  composer: document.getElementById("composer"),
  messageInput: document.getElementById("messageInput"),
  sendBtn: document.getElementById("sendBtn"),
  modelSelect: document.getElementById("modelSelect"),
  attachBtn: document.getElementById("attachBtn"),
  fileInput: document.getElementById("fileInput"),
};

let state = {
  threadId: null,
  threads: {},   // id -> { id, title, messages: null|[], updatedAt, loaded }
  isStreaming: false,
};

init();

async function init() {
  els.sidebarToggle.addEventListener("click", toggleSidebar);

  els.newChatBtn.addEventListener("click", () => {
    createLocalThread();
    renderThreadList();
    renderMessages();
  });

  els.messageInput.addEventListener("input", () => {
    autoResize(els.messageInput);
    els.sendBtn.disabled = els.messageInput.value.trim().length === 0;
  });

  els.messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  els.sendBtn.addEventListener("click", handleSend);

  document.querySelectorAll(".suggestion-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      els.messageInput.value = chip.dataset.prompt;
      autoResize(els.messageInput);
      els.sendBtn.disabled = false;
      handleSend();
    });
  });

  els.attachBtn.addEventListener("click", () => els.fileInput.click());

  els.fileInput.addEventListener("change", handleUpload);

  await loadConversations();

  if (!state.threadId) {
    createLocalThread();
  }

  renderThreadList();
  await selectThread(state.threadId);
}

/* ---------- Conversations (backend-synced) ---------- */

async function loadConversations() {
  try {
    const res = await fetch(CONVERSATIONS_ENDPOINT);
    if (!res.ok) return;

    const data = await res.json();

    (data.conversations || []).forEach((c) => {
      state.threads[c.thread_id] = {
        id: c.thread_id,
        title: c.title || "New Chat",
        messages: null,
        updatedAt: new Date(c.updated_at).getTime(),
        loaded: false,
      };
    });

    const mostRecent = Object.values(state.threads).sort((a, b) => b.updatedAt - a.updatedAt)[0];
    if (mostRecent) state.threadId = mostRecent.id;
  } catch (err) {
    // backend not reachable yet — fall back to a fresh local thread
  }
}

function createLocalThread() {
  const id = crypto.randomUUID ? crypto.randomUUID() : "thread_" + Date.now();
  state.threads[id] = {
    id,
    title: "New chat",
    messages: [],
    updatedAt: Date.now(),
    loaded: true,
  };
  state.threadId = id;
}

function currentThread() {
  return state.threads[state.threadId];
}

async function selectThread(threadId) {
  state.threadId = threadId;
  const thread = currentThread();

  if (thread && !thread.loaded) {
    try {
      const res = await fetch(`${HISTORY_ENDPOINT}/${encodeURIComponent(threadId)}`);
      if (res.ok) {
        const data = await res.json();
        thread.messages = (data.messages || []).map((m, i) => ({
          id: `${threadId}_${i}`,
          role: m.role,
          content: m.content,
        }));
      } else {
        thread.messages = [];
      }
    } catch {
      thread.messages = [];
    }
    thread.loaded = true;
  }

  renderThreadList();
  renderMessages();
}

function renderThreadList() {
  const items = Object.values(state.threads).sort((a, b) => b.updatedAt - a.updatedAt);

  els.threadList.innerHTML = '<div class="thread-list-label">Recent</div>';

  items.forEach((t) => {
    const btn = document.createElement("button");
    btn.className = "thread-item" + (t.id === state.threadId ? " active" : "");
    btn.textContent = t.title;
    btn.addEventListener("click", () => selectThread(t.id));
    els.threadList.appendChild(btn);
  });
}

/* ---------- Rendering ---------- */

function renderMessages() {
  const thread = currentThread();
  els.messages.innerHTML = "";

  if (!thread || !thread.messages || thread.messages.length === 0) {
    els.emptyState.style.display = "block";
    return;
  }

  els.emptyState.style.display = "none";

  thread.messages.forEach((m) => {
    els.messages.appendChild(buildMessageEl(m));
  });

  scrollToBottom();
}

function buildMessageEl(m) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + m.role;

  const body = document.createElement("div");
  body.className = "msg-body";

  if (m.kind === "file") {
    body.appendChild(buildFileChipEl(m));
  } else {
    const text = document.createElement("div");
    text.className = "msg-text";
    text.id = m.id;
    text.innerHTML = formatContent(m.content);
    body.appendChild(text);
  }

  wrap.appendChild(body);
  return wrap;
}

function buildFileChipEl(m) {
  const chip = document.createElement("div");
  chip.className = "file-chip" + (m.status === "failed" ? " failed" : "");
  chip.id = m.id;

  chip.innerHTML = `
    <div class="file-chip-icon">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
        <path d="M4 2h6l4 4v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="file-chip-info">
      <span class="file-chip-name">${escapeHtml(m.fileName)}</span>
      <span class="file-chip-status" id="${m.id}_status">${escapeHtml(m.statusText)}</span>
    </div>
  `;

  return chip;
}

function escapeHtml(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function formatContent(content) {
  const escaped = (content || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  return escaped
    .split(/\n{2,}/)
    .map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`)
    .join("");
}

function autoResize(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = Math.min(textarea.scrollHeight, 200) + "px";
}

function scrollToBottom() {
  els.chatScroll.scrollTop = els.chatScroll.scrollHeight;
}

function toggleSidebar() {
  els.app.classList.toggle("sidebar-collapsed");
  els.app.classList.toggle("sidebar-open");
}

/* ---------- Upload ---------- */

async function handleUpload(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const thread = currentThread();

  els.emptyState.style.display = "none";

  const fileMsgId = "file_" + Date.now();
  thread.messages.push({
    id: fileMsgId,
    role: "user",
    kind: "file",
    fileName: file.name,
    statusText: "Uploading...",
    status: "uploading",
  });
  renderMessages();

  const formData = new FormData();
  formData.append("file", file);
  formData.append("thread_id", state.threadId);

  try {
    const res = await fetch(UPLOAD_ENDPOINT, { method: "POST", body: formData });
    const data = await res.json();

    updateFileChip(fileMsgId, data.success ? (data.message || "Uploaded") : (data.message || "Upload failed"), data.success ? "done" : "failed");

    if (data.success) {
      thread.title = thread.title === "New chat" ? file.name : thread.title;
      thread.updatedAt = Date.now();
      renderThreadList();
    }
  } catch (err) {
    updateFileChip(fileMsgId, "Upload failed: " + err.message, "failed");
  }
}

function updateFileChip(id, statusText, status) {
  const thread = currentThread();
  const msg = thread.messages.find((m) => m.id === id);
  if (!msg) return;

  msg.statusText = statusText;
  msg.status = status;

  const chipEl = document.getElementById(id);
  const statusEl = document.getElementById(id + "_status");
  if (statusEl) statusEl.textContent = statusText;
  if (chipEl) chipEl.classList.toggle("failed", status === "failed");
}

/* ---------- Sending (SSE over fetch, per /chat/stream contract) ---------- */

async function handleSend() {
  const text = els.messageInput.value.trim();
  if (!text || state.isStreaming) return;

  const thread = currentThread();

  if (thread.messages.length === 0) {
    thread.title = text.slice(0, 40) + (text.length > 40 ? "..." : "");
  }

  thread.messages.push({ id: "m_" + Date.now(), role: "user", content: text });
  thread.updatedAt = Date.now();
  renderThreadList();
  renderMessages();

  els.messageInput.value = "";
  autoResize(els.messageInput);
  els.sendBtn.disabled = true;

  const assistantMsgId = "m_" + Date.now() + "_a";
  thread.messages.push({ id: assistantMsgId, role: "assistant", content: "" });
  renderMessages();

  const assistantEl = document.getElementById(assistantMsgId);
  assistantEl.innerHTML = '<span class="dost-thinking"><span class="dost-orb"></span><span class="dost-thinking-label">Thinking...</span></span>';

  state.isStreaming = true;
  let fullText = "";
  let first = true;

  try {
    const response = await fetch(CHAT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        thread_id: state.threadId,
        model: els.modelSelect.value,
      }),
    });

    if (!response.ok || !response.body) {
      throw new Error(`Server returned ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split("\n\n");
      buffer = events.pop(); // keep the last (possibly incomplete) chunk

      for (const evt of events) {
        const line = evt.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;

        let payload;
        try {
          payload = JSON.parse(line.slice(5).trim());
        } catch {
          continue;
        }

        if (payload.error) {
          throw new Error(payload.error);
        }

        if (payload.token) {
          if (first) {
            assistantEl.innerHTML = "";
            first = false;
          }
          fullText += payload.token;
          assistantEl.innerHTML = formatContent(fullText);
          scrollToBottom();
        }

        if (payload.done) {
          break;
        }
      }
    }

    thread.messages.find((m) => m.id === assistantMsgId).content = fullText;
    thread.updatedAt = Date.now();
    renderThreadList();
  } catch (err) {
    assistantEl.innerHTML = `<span class="msg-error">Dost AI couldn't respond — (${err.message})</span>`;
    thread.messages.find((m) => m.id === assistantMsgId).content = assistantEl.textContent;
  } finally {
    state.isStreaming = false;
  }
}
</script>
